<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 로또</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--text:#1b1f33;--sub:#5f667f;--line:#e4e7f0;--accent:#4b3bc9}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1120;--card:#171a2e;--text:#eceef8;--sub:#9aa0bd;--line:#2a2e48;--accent:#9b8cff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;line-height:1.7}
  main{max-width:560px;margin:0 auto;padding:56px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center}
  img{width:96px;height:96px;border-radius:22px}
  h1{margin:16px 0 4px;font-size:24px;letter-spacing:-.02em}
  p{color:var(--sub);margin:0 0 20px}
  a.btn{display:inline-block;padding:11px 18px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
  .foot{margin-top:24px;font-size:13px;color:var(--sub)}
  .foot a{color:var(--sub)}
</style>
</head>
<body>
<main><div class="card">
  <img src="icon-512.png" alt="나만의 로또 아이콘">
  <h1>나만의 로또</h1>
  <p>역대 로또 당첨번호 통계를 보고, 통계 기반으로 나만의 번호를 뽑아 보세요.</p>
  <a class="btn" href="privacy-policy.html">개인정보처리방침</a>
  <div class="foot">문의: <a href="mailto:jojogamessupport@gmail.com">jojogamessupport@gmail.com</a><br>비공식 앱이며 동행복권과 관련이 없습니다.</div>
</div></main>
</body>
</html>
